title: "Suhyeon Lee"
description: "KAIST Ph.D. student researching AI agents, digital markets, and platform governance"
url: "https://suhyeonnnnn.github.io"
baseurl: ""

# Author information
author:
  name: "Suhyeon Lee"
  email: "suhyeonlee@kaist.ac.kr"
  github: "suhyeonnnnn"
  university: "KAIST"
  department: "Management Engineering"
  degree: "Ph.D. Student"
  location: "Seoul, Republic of Korea"

# Site settings
language: en
timezone: Asia/Seoul
encoding: utf-8

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Sass settings
sass:
  style: compressed
  sass_dir: _sass

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Pagination
paginate: 5
paginate_path: "/posts/page:num/"

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:name/
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Suhyeon Lee"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"

# SEO settings
lang: en_US
logo: /assets/images/logo.png
social:
  name: Suhyeon Lee
  links:
    - https://github.com/suhyeonnnnn

# Research Areas
research:
  substantive:
    - "AI Agents and Digital Markets"
    - "Human-AI Decision Making"
    - "AI Governance and Digital Platforms"
  methodological:
    - "Causal Inference"
    - "Experiments"
    - "LLM-based Behavioral Simulation"

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - node_modules/
